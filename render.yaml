services:
  - type: web
    name: restaurant-pos-api
    runtime: docker
    plan: free
    dockerfilePath: ./rms-api/Dockerfile
    dockerContext: .
    branch: Development2
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: restaurant-pos-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: DB_CONNECTION
        value: central
      - key: TENANCY_MODE
        value: single_database
      - key: CENTRAL_DB_HOST
        value: 127.0.0.1
      - key: CENTRAL_DB_PORT
        value: "3306"
      - key: CENTRAL_DB_DATABASE
        value: rms_demo
      - key: CENTRAL_DB_USERNAME
        value: rms_demo
      - key: CENTRAL_DB_PASSWORD
        generateValue: true
      - key: STRIPE_KEY
        sync: false
      - key: STRIPE_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: SUPER_ADMIN_NAME
        value: Super Admin
      - key: SUPER_ADMIN_USERNAME
        value: admin
      - key: SUPER_ADMIN_EMAIL
        value: admin@rms.local
      - key: SUPER_ADMIN_PASSWORD
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: restaurant-pos-api
          envVarKey: RENDER_EXTERNAL_URL
